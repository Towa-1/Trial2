<!DOCTYPE html>
<html>
<head>
  <style>
    section {
      padding: 20px;
      border: 2px solid gray;
      margin: 10px 0;
    }

    /* When a section is targeted by the URL */
    section:target {
      border-color: blue;
      background-color: #eef;
    }
  </style>
</head>
<body>

  <a href="#about">Go to About</a> |
  <a href="#contact">Go to Contact</a>

  <section id="about">
    <h2>About Section</h2>
    <p>This highlights when you click “Go to About”.</p>
  </section>

  <section id="contact">
    <h2>Contact Section</h2>
    <p>This highlights when you click “Go to Contact”.</p>
  </section>

</body>
</html>
